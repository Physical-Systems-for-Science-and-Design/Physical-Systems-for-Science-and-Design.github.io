<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Reliable physical modeling across three scaling axes</title>
  <desc id="desc">A diagram showing resolution scaling, domain scaling, and reality scaling feeding into reliable physical modeling, evaluated by fidelity, uncertainty, failure modes, and transfer.</desc>
  <defs>
    <linearGradient id="centerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1a1a2e" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5a6178"/>
    </marker>
  </defs>
  <rect width="980" height="520" rx="24" fill="#f7f8fa"/>
  <g filter="url(#shadow)">
    <rect x="340" y="178" width="300" height="132" rx="18" fill="url(#centerGrad)"/>
    <text x="490" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Reliable</text>
    <text x="490" y="266" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Physical Modeling</text>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="62" y="70" width="250" height="112" rx="14" fill="#ffffff" stroke="#d7dce5"/>
    <text x="187" y="114" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">Resolution Scaling</text>
    <text x="187" y="146" text-anchor="middle" font-size="15" fill="#5a6178">fidelity under refinement</text>

    <rect x="668" y="70" width="250" height="112" rx="14" fill="#ffffff" stroke="#d7dce5"/>
    <text x="793" y="114" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">Domain Scaling</text>
    <text x="793" y="146" text-anchor="middle" font-size="15" fill="#5a6178">geometries, materials, regimes</text>

    <rect x="365" y="356" width="250" height="112" rx="14" fill="#ffffff" stroke="#d7dce5"/>
    <text x="490" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">Reality Scaling</text>
    <text x="490" y="432" text-anchor="middle" font-size="15" fill="#5a6178">simulation to experiment</text>

    <path d="M312 146 C360 164, 389 180, 423 202" fill="none" stroke="#5a6178" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M668 146 C620 164, 591 180, 557 202" fill="none" stroke="#5a6178" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M490 356 L490 319" fill="none" stroke="#5a6178" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="112" y="262" width="196" height="48" rx="24" fill="#eef0f3"/>
    <text x="210" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">uncertainty</text>
    <rect x="672" y="262" width="196" height="48" rx="24" fill="#eef0f3"/>
    <text x="770" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">failure modes</text>
    <rect x="390" y="50" width="200" height="48" rx="24" fill="#eef0f3"/>
    <text x="490" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">physical validity</text>
    <rect x="372" y="314" width="236" height="32" rx="16" fill="#eef0f3"/>
    <text x="490" y="335" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">benchmarkable stress tests</text>
  </g>
</svg>
