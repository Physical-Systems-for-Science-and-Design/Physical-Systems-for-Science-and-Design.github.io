<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Three scaling questions for physical modeling</title>
  <desc id="desc">A diagram explaining resolution scaling, domain scaling, and reality scaling as three concrete questions for reliable physical modeling.</desc>
  <rect width="980" height="420" rx="12" fill="#f8f9fb"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="490" y="54" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">How should physical models scale?</text>
    <text x="490" y="84" text-anchor="middle" font-size="16" fill="#4b5563">The workshop focuses on three concrete questions.</text>

    <rect x="70" y="126" width="260" height="158" rx="8" fill="#ffffff" stroke="#d9dde5"/>
    <text x="200" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#245b83">Resolution</text>
    <text x="200" y="198" text-anchor="middle" font-size="15" fill="#111827">Does the model remain accurate</text>
    <text x="200" y="222" text-anchor="middle" font-size="15" fill="#111827">as grids, time steps, or</text>
    <text x="200" y="246" text-anchor="middle" font-size="15" fill="#111827">particle counts increase?</text>

    <rect x="360" y="126" width="260" height="158" rx="8" fill="#ffffff" stroke="#d9dde5"/>
    <text x="490" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#245b83">Domain</text>
    <text x="490" y="198" text-anchor="middle" font-size="15" fill="#111827">Does the method generalize</text>
    <text x="490" y="222" text-anchor="middle" font-size="15" fill="#111827">to new geometries, materials,</text>
    <text x="490" y="246" text-anchor="middle" font-size="15" fill="#111827">and boundary conditions?</text>

    <rect x="650" y="126" width="260" height="158" rx="8" fill="#ffffff" stroke="#d9dde5"/>
    <text x="780" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#245b83">Reality</text>
    <text x="780" y="198" text-anchor="middle" font-size="15" fill="#111827">Does behavior transfer from</text>
    <text x="780" y="222" text-anchor="middle" font-size="15" fill="#111827">simulation to experiments,</text>
    <text x="780" y="246" text-anchor="middle" font-size="15" fill="#111827">hardware, or real data?</text>

    <rect x="150" y="324" width="680" height="54" rx="8" fill="#eef4f8" stroke="#c8d7e3"/>
    <text x="490" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Common checks</text>
    <text x="490" y="367" text-anchor="middle" font-size="15" fill="#4b5563">accuracy, stability, uncertainty, failure modes, and reproducibility</text>
  </g>
</svg>
